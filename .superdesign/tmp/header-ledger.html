<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordoria Business Storefront Header</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#f58220',
            'brand-navy': '#002d62',
            background: 'oklch(1 0 0)',
            foreground: '#002d62',
            primary: '#f58220',
            'primary-foreground': '#ffffff',
            muted: 'oklch(0.97 0 0)',
            'muted-foreground': 'oklch(0.45 0.02 250)',
            border: 'oklch(0.922 0 0)',
            ring: '#f58220',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f7f7f8;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div class="min-h-screen bg-[#f7f7f8]" data-sd-id="1">
    <header class="sticky top-0 z-40 border-b border-border bg-white" data-sd-id="2">
      <div class="mx-auto flex h-16 max-w-[1440px] items-center gap-4 px-3 sm:px-4 lg:px-6" data-sd-id="3">
        <!-- Mobile Menu Button (Hidden on Desktop) -->
        <button type="button" class="inline-flex size-10 items-center justify-center rounded-[2px] border border-border lg:hidden" aria-label="Categories" data-sd-id="4">
          <iconify-icon icon="lucide:menu" class="text-xl"></iconify-icon>
        </button>

        <!-- Logo & Wordmark -->
        <a href="#" id="nav-home-link" class="flex shrink-0 items-center gap-2 pr-2" data-sd-id="5">
          <img src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/63e54a69-ecd4-416d-87a7-7936aa58bf5e/brand-assets/public-icon.png/icon.png" alt="Ordoria Business" class="size-9 object-contain" data-sd-id="6">
          <span class="hidden text-lg font-bold tracking-tight text-brand-navy sm:inline" data-sd-id="7">
            Ordoria Business
          </span>
        </a>

        <!-- Delivery Picker (Desktop) -->
        <div class="hidden min-w-0 flex-1 md:flex lg:max-w-[280px]" data-sd-id="8">
          <button type="button" id="btn-delivery-picker" class="flex w-full min-w-0 items-center justify-between rounded-[2px] border border-border px-3 py-1.5 text-left hover:bg-muted/40 transition-colors" data-sd-id="9">
            <div class="flex items-start gap-2">
              <iconify-icon icon="lucide:map-pin" class="mt-0.5 size-4 shrink-0 text-brand-navy"></iconify-icon>
              <span class="min-w-0 truncate flex flex-col" data-sd-id="10">
                <span class="text-[11px] uppercase tracking-wider text-muted-foreground font-semibold leading-none mb-1" data-sd-id="11">
                  Delivery
                </span>
                <span class="truncate text-sm font-medium text-brand-navy leading-none" data-sd-id="12">
                  Demo Kitchen · SW1A 1AA
                </span>
              </span>
            </div>
            <iconify-icon icon="lucide:chevron-down" class="ml-2 size-4 shrink-0 text-muted-foreground"></iconify-icon>
          </button>
        </div>

        <!-- Search Bar (Desktop) -->
        <form action="#" class="hidden min-w-0 flex-[1.4] md:block" data-sd-id="13">
          <div class="relative flex h-10 w-full items-center rounded-[2px] border border-border bg-white" data-sd-id="14">
            <iconify-icon icon="lucide:search" class="absolute left-3 size-4 text-muted-foreground"></iconify-icon>
            <input type="text" name="q" placeholder="Search products" class="h-full w-full min-w-0 bg-transparent pl-9 pr-4 text-sm outline-none placeholder:text-muted-foreground focus-visible:ring-1 focus-visible:ring-brand-navy" data-sd-id="15">
          </div>
        </form>

        <!-- Right Actions -->
        <div class="ml-auto flex items-center gap-4" data-sd-id="16">
          <div class="hidden items-center gap-4 sm:flex pr-4 border-r border-border" data-sd-id="17">
            <a href="#" id="btn-signin" class="text-sm font-medium text-brand-navy hover:underline" data-sd-id="18">
              Sign in
            </a>
            <button type="button" id="btn-signup" class="inline-flex h-9 items-center justify-center rounded-[2px] bg-brand-navy px-4 text-sm font-medium text-primary-foreground transition-all hover:bg-brand-navy/90" data-sd-id="19">
              Sign up
            </button>
          </div>

          <!-- Tight Icon Rail -->
          <div class="flex items-center divide-x divide-border border border-border rounded-[2px]">
            <!-- Locale Control -->
            <button type="button" id="btn-locale" class="inline-flex h-9 w-10 items-center justify-center text-brand-navy hover:bg-muted/60 transition-colors" aria-label="Locale" data-sd-id="20">
              <span class="text-sm font-medium" data-sd-id="21">EN</span>
            </button>

            <!-- Favourites -->
            <a href="#" id="nav-fav-link" class="inline-flex h-9 w-10 items-center justify-center text-brand-navy hover:bg-muted/60 transition-colors" aria-label="Favourites" data-sd-id="22">
              <iconify-icon icon="lucide:heart" class="size-[18px]"></iconify-icon>
            </a>

            <!-- Cart -->
            <a href="#" id="nav-cart-link" class="relative inline-flex h-9 px-3 items-center justify-center gap-2 text-brand-navy hover:bg-muted/60 transition-colors bg-muted/20" aria-label="Cart" data-sd-id="23">
              <iconify-icon icon="lucide:shopping-bag" class="size-[18px]"></iconify-icon>
              <span class="flex items-center justify-center rounded-[2px] bg-brand-navy px-1.5 py-0.5 text-[10px] font-bold text-primary-foreground" data-sd-id="24">
                3
              </span>
            </a>
          </div>
        </div>
      </div>
    </header>
    <!-- Empty context area below header -->
    <main class="p-6" data-sd-id="25">
      <div class="mx-auto max-w-[1440px]" data-sd-id="26">
      </div>
    </main>
  </div>
</body>
</html>
