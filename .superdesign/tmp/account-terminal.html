<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account — Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
</head>
<body>
  <div class="min-h-[720px] w-[960px] bg-[#f7f7f8] px-6 py-5 text-[#002d62]" style="font-family: ui-sans-serif, system-ui, sans-serif;">
    <div class="mb-5 border-b border-[#e5e7eb] pb-4">
      <p class="font-mono text-[10px] font-medium uppercase tracking-widest text-gray-500">Profile</p>
      <h1 class="text-[22px] font-semibold tracking-tight">My account</h1>
      <p class="text-sm text-gray-500">Your profile and business details</p>
    </div>
    <div class="grid gap-5 lg:grid-cols-2">
      <section class="rounded-[2px] border border-[#e5e7eb] bg-white p-5">
        <div class="mb-3 border-b border-[#e5e7eb] pb-2">
          <p class="font-mono text-[10px] font-medium uppercase tracking-widest text-gray-500">Profile</p>
          <h2 class="text-[15px] font-semibold tracking-tight">Profile</h2>
        </div>
        <div class="flex justify-between gap-4 border-b border-[#e5e7eb] py-3 text-sm">
          <span class="text-[11px] font-medium uppercase tracking-wide text-gray-500">Full name</span>
          <span class="font-medium">Alex Morgan</span>
        </div>
        <div class="flex justify-between gap-4 border-b border-[#e5e7eb] py-3 text-sm">
          <span class="text-[11px] font-medium uppercase tracking-wide text-gray-500">Email</span>
          <span class="font-medium">alex@harbourkitchen.co.uk</span>
        </div>
        <div class="flex justify-between gap-4 py-3 text-sm">
          <span class="text-[11px] font-medium uppercase tracking-wide text-gray-500">Phone</span>
          <span class="font-medium">+44 7700 900123</span>
        </div>
      </section>
      <section class="rounded-[2px] border border-[#e5e7eb] bg-white p-5">
        <div class="mb-3 flex items-start justify-between border-b border-[#e5e7eb] pb-2">
          <div>
            <p class="font-mono text-[10px] font-medium uppercase tracking-widest text-gray-500">Venue</p>
            <h2 class="text-[15px] font-semibold tracking-tight">Business</h2>
            <p class="mt-1 text-sm text-gray-500">Active venue details</p>
          </div>
          <span class="rounded-[2px] bg-[#002d62] px-2 py-0.5 font-mono text-[10px] font-medium uppercase tracking-wide text-white">Approved</span>
        </div>
        <div class="mb-4 flex gap-2">
          <button type="button" class="rounded-[2px] bg-[#002d62] px-3 py-1.5 text-xs font-medium text-white">Harbour Kitchen</button>
          <button type="button" class="rounded-[2px] border border-[#e5e7eb] bg-white px-3 py-1.5 text-xs font-medium">Second Site</button>
        </div>
        <div class="flex justify-between gap-4 border-b border-[#e5e7eb] py-3 text-sm">
          <span class="text-[11px] font-medium uppercase tracking-wide text-gray-500">Trading name</span>
          <span class="max-w-[65%] text-right font-medium">Harbour Kitchen</span>
        </div>
        <div class="flex justify-between gap-4 border-b border-[#e5e7eb] py-3 text-sm">
          <span class="text-[11px] font-medium uppercase tracking-wide text-gray-500">Address</span>
          <span class="max-w-[65%] text-right font-medium">12 Quay St, Bristol BS1 4AX</span>
        </div>
        <div class="flex justify-between gap-4 py-3 text-sm">
          <span class="text-[11px] font-medium uppercase tracking-wide text-gray-500">Hours</span>
          <span class="font-medium">08:00 – 22:00</span>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
